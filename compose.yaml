name: pretix

# Production stack for pretix (small-scale), based on
# https://docs.pretix.eu/self-hosting/installation/docker_smallscale/
#
# Replaces the host-level Postgres, Redis, systemd unit and cron job of the
# guide with containers. The `nginx` service terminates TLS and balances
# requests across all `pretix` replicas.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-pretix: &pretix-common
  image: pretix/standalone:${PRETIX_VERSION:-stable}
  restart: unless-stopped
  logging: *default-logging
  environment: &pretix-env
    # Pretix reads PRETIX_<SECTION>_<KEY> env vars as overrides of pretix.cfg.
    PRETIX_PRETIX_INSTANCE_NAME: ${PRETIX_INSTANCE_NAME:-pretix}
    PRETIX_PRETIX_URL: ${PRETIX_URL:?Set PRETIX_URL, e.g. https://tickets.example.com}
    PRETIX_PRETIX_CURRENCY: ${PRETIX_CURRENCY:-EUR}
    PRETIX_PRETIX_DATADIR: /data
    PRETIX_PRETIX_TRUST_X_FORWARDED_FOR: "on"
    PRETIX_PRETIX_TRUST_X_FORWARDED_PROTO: "on"

    PRETIX_DATABASE_BACKEND: postgresql
    PRETIX_DATABASE_NAME: ${POSTGRES_DB:-pretix}
    PRETIX_DATABASE_USER: ${POSTGRES_USER:-pretix}
    PRETIX_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    PRETIX_DATABASE_HOST: postgres

    PRETIX_REDIS_LOCATION: redis://redis:6379/0
    PRETIX_REDIS_SESSIONS: "true"
    PRETIX_CELERY_BACKEND: redis://redis:6379/1
    PRETIX_CELERY_BROKER: redis://redis:6379/2

    PRETIX_MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    # Defaults target the bundled `smtp` service (plain SMTP on the private network).
    PRETIX_MAIL_HOST: ${MAIL_HOST:-smtp}
    PRETIX_MAIL_PORT: ${MAIL_PORT:-25}
    PRETIX_MAIL_USER: ${MAIL_USER:-}
    PRETIX_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    PRETIX_MAIL_TLS: ${MAIL_TLS:-off}
    PRETIX_MAIL_SSL: ${MAIL_SSL:-off}
  volumes:
    - pretix_data:/data
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pretix}
      POSTGRES_USER: ${POSTGRES_USER:-pretix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pretix_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pretix_redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Outbound-only mail relay (Postfix + OpenDKIM). No published ports: pretix
  # reaches it as `smtp:25` over the private network. Set SMTP_RELAYHOST to
  # send through an upstream provider instead of delivering directly.
  smtp:
    image: boky/postfix:${SMTP_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:?Set MAIL_DOMAIN, e.g. example.com}
      POSTFIX_myhostname: ${SMTP_HOSTNAME:?Set SMTP_HOSTNAME, e.g. mail.example.com}
      DKIM_AUTOGENERATE: "true"
      RELAYHOST: ${SMTP_RELAYHOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAYHOST_USERNAME:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAYHOST_PASSWORD:-}
    volumes:
      - smtp_spool:/var/spool/postfix
      - smtp_dkim:/etc/opendkim/keys
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "postfix status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scale with: docker compose up -d --scale pretix=N
  # No published ports: nginx reaches every replica through Docker DNS.
  pretix:
    <<: *pretix-common
    # `pretix cron` must run in every pretix container, so each replica runs
    # its own loop next to the main process (exec keeps `pretix all` as PID 1).
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          while true; do
            sleep "$${CRON_INTERVAL_SECONDS}"
            pretix runperiodic || echo "pretix runperiodic failed" >&2
          done
        ) &
        exec pretix "$$@"
      - pretix-entrypoint
    command: ["all"]
    environment:
      <<: *pretix-env
      # Migrations are run once by the `migrate` service, not by each replica.
      AUTOMIGRATE: "skip"
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-900}
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      smtp:
        condition: service_healthy
    sysctls:
      net.core.somaxconn: 4096
    healthcheck:
      test:
        - CMD
        - pretix
        - check
        - -v
        - '3'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # One-shot database migration. Run after install and after every upgrade:
  #   docker compose run --rm migrate
  migrate:
    <<: *pretix-common
    profiles: ["tools"]
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *pretix-env
      AUTOMIGRATE: "skip"

  # TLS termination and load balancing across pretix replicas.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      PRETIX_DOMAIN: ${PRETIX_DOMAIN:?Set PRETIX_DOMAIN, e.g. tickets.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Rendered with envsubst by the official image into /etc/nginx/conf.d/.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      pretix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # No external route: only postgres/redis/pretix talk here.
  backend:
    internal: true
  frontend:

volumes:
  pretix_data:
  pretix_db:
  pretix_redis:
  smtp_spool:
  smtp_dkim:
